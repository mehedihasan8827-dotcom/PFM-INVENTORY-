<style>
/* ════ Elementor-এ পুরো স্ক্রিন জুড়ে বসানো ════ */
#gc-contact{position:relative;display:block;box-sizing:border-box;width:var(--gc-vw,100vw);max-width:none;min-width:0;margin:0 0 0 calc(50% - var(--gc-vw,100vw) / 2);padding:0;border:0;float:none}
body:has(#gc-contact){overflow-x:clip}
/* যে Elementor কন্টেইনারে শুধু এই সেকশনটি আছে, তার উপর-নিচের ডিফল্ট ফাঁক বাদ */
.e-con-full:has(> .elementor-widget-html:only-child #gc-contact),
.e-con > .e-con-inner:has(> .elementor-widget-html:only-child #gc-contact),
.elementor-widget-wrap:has(> .elementor-widget-html:only-child #gc-contact){padding-top:0;padding-bottom:0}

#gc-contact .gc{
  /* রং — হিরোর একই প্যালেট */
  --gc-bg:#faf9f6;          /* হালকা অফ-হোয়াইট ব্যাকগ্রাউন্ড */
  --gc-surface:#ffffff;     /* কার্ড */
  --gc-line:#e7e4dc;        /* চিকন বর্ডার */
  --gc-line-soft:#efece5;   /* দুই সারির মাঝের রেখা */
  --gc-ink:#2f3a33;         /* মূল লেখা */
  --gc-ink-soft:#6d736c;    /* হালকা লেখা */
  --gc-green:#174a33;       /* শিরোনাম */
  --gc-caramel:#a8501c;     /* "কথা বলে" ও প্রজেক্টের আইকন */
  --gc-gold:#c99a3e;        /* শিরোনামের নিচের টান */
  --gc-wa:#168445;  --gc-wa-text:#136b3a;      /* হোয়াটসঅ্যাপ বাটন */
  --gc-call:#a8501c; --gc-call-text:#8f4316;   /* কল বাটন */
  --gc-font:'Hind Siliguri','Noto Sans Bengali',sans-serif;

  container:gc / inline-size;
  position:relative;
  padding:48px 16px 52px;
  color:var(--gc-ink);
  font-family:var(--gc-font);
  text-align:center;
  -webkit-font-smoothing:antialiased;
  background:var(--gc-bg);
}
#gc-contact .gc *,#gc-contact .gc *::before,#gc-contact .gc *::after{box-sizing:border-box}
/* থিম/Elementor-এর টাইপোগ্রাফি ও লিংকের স্টাইল যেন ভেতরে না ঢোকে — ডিজাইনের মূল মানগুলো স্থির করা */
#gc-contact .gc{margin:0;font-size:16px;font-weight:400;font-style:normal;line-height:normal;letter-spacing:normal;word-spacing:normal;text-transform:none;text-shadow:none;text-indent:0;white-space:normal;overflow-wrap:normal;word-break:normal;text-rendering:auto}
#gc-contact .gc *{font-family:inherit;letter-spacing:inherit;word-spacing:inherit;text-transform:inherit;text-shadow:inherit}
#gc-contact .gc :where(div,span,a,dl,dt,dd){font-size:inherit;line-height:inherit;font-weight:inherit;font-style:normal;border:0;background:none}
#gc-contact .gc :where(h2){font-style:normal;text-align:inherit;text-decoration:none;border:0;background:none}
#gc-contact .gc a{text-decoration:none;border:0;border-radius:0;box-shadow:none;outline:0;background:none;color:inherit;transition:none;margin:0;opacity:1}
#gc-contact .gc a:hover,#gc-contact .gc a:focus,#gc-contact .gc a:active,#gc-contact .gc a:visited{text-decoration:none;border:0;box-shadow:none;outline:0;background:none;color:inherit;margin:0;opacity:1}
#gc-contact .gc svg{fill:none;max-width:none;max-height:none;min-width:0;min-height:0}
#gc-contact .gc :where(h2,p,dl,dt,dd){margin:0;padding:0;letter-spacing:normal;text-transform:none}
#gc-contact .gc__inner{max-width:540px;margin:0 auto}

/* — শিরোনাম — */
#gc-contact .gc__eyebrow{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:14.4px;line-height:1.5;color:var(--gc-green)}
#gc-contact .gc__eyebrow::before,#gc-contact .gc__eyebrow::after{content:"";width:22px;height:1px;background:currentColor;opacity:.35}
#gc-contact .gc__eyebrow svg{display:block;width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#gc-contact .gc__title{margin-top:8px;font-weight:700;font-size:26.4px;font-size:clamp(22.4px,7cqi,36.8px);line-height:1.35;color:var(--gc-green)}
#gc-contact .gc__accent{position:relative;display:inline-block;color:var(--gc-caramel)}
#gc-contact .gc__swash{position:absolute;left:-3%;width:106%;bottom:-.18em;height:.28em;display:block;overflow:visible;color:var(--gc-gold)}

/* — কার্ড: উপরে দুই বাটন-সারি, নিচে রসিদের মতো প্রজেক্ট-অংশ — */
#gc-contact .gc__panel{
  margin-top:24px;text-align:left;overflow:hidden;
  background:var(--gc-surface);border:1px solid var(--gc-line);border-radius:22px;
  box-shadow:0 1px 2px rgba(30,32,24,.04),0 26px 50px -36px rgba(30,32,24,.45);
}
#gc-contact .gc__actions{display:grid}
#gc-contact .gc .gc__btn{
  position:relative;display:flex;align-items:center;gap:14px;min-height:80px;padding:15px 16px;
  color:var(--gc-ink);text-decoration:none;-webkit-tap-highlight-color:transparent;
}
#gc-contact .gc .gc__btn + .gc__btn::before{content:"";position:absolute;top:0;left:80px;right:16px;height:1px;background:var(--gc-line-soft)}
#gc-contact .gc .gc__btn:hover{background:#fbfaf6}
#gc-contact .gc .gc__btn:active{background:#f6f3ec}
#gc-contact .gc .gc__btn:focus-visible{outline:2px solid var(--b);outline-offset:-3px;border-radius:20px}
#gc-contact .gc__btn--wa{--b:var(--gc-wa);--bt:var(--gc-wa-text)}
#gc-contact .gc__btn--call{--b:var(--gc-call);--bt:var(--gc-call-text)}
#gc-contact .gc__btn-icon{
  flex:none;display:grid;place-items:center;width:50px;height:50px;border-radius:16px;
  background:linear-gradient(160deg,rgba(255,255,255,.18),rgba(255,255,255,0) 60%),var(--b);color:#fff;
  box-shadow:0 10px 18px -11px var(--b);
}
#gc-contact .gc__btn-icon svg{display:block;width:26px;height:26px}
#gc-contact .gc__btn-text{display:flex;flex-direction:column;min-width:0}
#gc-contact .gc__btn-label{font-weight:700;font-size:16.64px;line-height:1.3;color:var(--gc-ink)}
#gc-contact .gc__btn-num{font-weight:600;font-size:14.72px;line-height:1.35;white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--bt)}
#gc-contact .gc__chev{flex:none;display:grid;place-items:center;margin-left:auto;width:30px;height:30px;border-radius:50%;background:#f4f1ea;color:var(--gc-ink-soft)}
#gc-contact .gc__chev svg{display:block;width:16px;height:16px}
#gc-contact .gc .gc__btn:hover .gc__chev{background:var(--b);color:#fff}

#gc-contact .gc__farm{padding:18px 16px;background:linear-gradient(180deg,#f7f3ea,#f9f6ef);border-top:1.5px dashed #dcd3bf}
#gc-contact .gc__farm-head{display:flex;align-items:center;gap:12px}
#gc-contact .gc__badge{flex:none;display:grid;place-items:center;width:46px;height:46px;border-radius:50%;background:#fff;border:1px solid #ece2cb;box-shadow:0 8px 16px -12px rgba(150,110,30,.5)}
#gc-contact .gc__badge svg{display:block;width:28px;height:auto}
#gc-contact .gc__farm-title{font-weight:700;font-size:16.32px;line-height:1.35;color:var(--gc-green)}
#gc-contact .gc__farm-note{font-weight:500;font-size:13.6px;line-height:1.4;color:var(--gc-ink-soft)}
#gc-contact .gc__facts{display:grid;gap:12px;margin-top:14px}
#gc-contact .gc__fact{display:flex;gap:12px;align-items:flex-start}
#gc-contact .gc__fact-icon{flex:none;display:grid;place-items:center;width:32px;height:32px;border-radius:10px;background:#fff;border:1px solid #ece5d5;color:var(--gc-caramel)}
#gc-contact .gc__fact-icon svg{display:block;width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
#gc-contact .gc__fact dt{font-weight:600;font-size:12.8px;line-height:1.4;color:var(--gc-ink-soft)}
#gc-contact .gc__fact dd{font-weight:700;font-size:15.68px;line-height:1.5;color:var(--gc-ink)}
#gc-contact .gc__tag{display:inline-block;margin-left:4px;padding:0 8px;border-radius:999px;background:#fbf1dc;color:#86590c;font-weight:700;font-size:12.48px;line-height:1.7;vertical-align:1px}

/* ট্যাবলেট / ডেস্কটপ */
@container gc (min-width:720px){
  #gc-contact .gc{padding:72px 24px 76px}
  #gc-contact .gc__panel{margin-top:30px}
  #gc-contact .gc .gc__btn{min-height:84px;padding:16px 22px}

  #gc-contact .gc__farm{padding:20px 22px}
  #gc-contact .gc__facts{grid-template-columns:1fr 1fr;gap:16px}
}

/* — অ্যানিমেশন: স্ক্রল করে এলে শুরু হয় (যারা কম মোশন পছন্দ করেন তাদের জন্য বন্ধ) — */
@keyframes gc-rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes gc-draw{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
@media (prefers-reduced-motion:no-preference){
  #gc-contact .gc__panel{animation:gc-rise .6s cubic-bezier(.22,.8,.3,1) .1s both}
  #gc-contact .gc__swash{animation:gc-draw .8s cubic-bezier(.65,0,.35,1) .2s both}
  #gc-contact .gc .gc__btn{transition:background-color .2s ease}
  #gc-contact .gc__chev{transition:background-color .2s ease,color .2s ease}
  #gc-contact .gc--wait .gc__panel,#gc-contact .gc--wait .gc__swash{animation-play-state:paused}
}
</style>

<script>
(function () {

  // পুরো স্ক্রিন জুড়ে বসানো: Elementor কন্টেইনারের প্যাডিং/বক্সড চওড়া থাকলেও সেকশন কিনারা থেকে কিনারা
  var host = document.getElementById('gc-contact');
  if (host) {
    var fit = function () {
      host.style.marginLeft = '';
      host.style.setProperty('--gc-vw', document.documentElement.clientWidth + 'px');
      var left = host.getBoundingClientRect().left;
      if (Math.abs(left) > 0.25) host.style.marginLeft = (parseFloat(getComputedStyle(host).marginLeft) - left) + 'px';
    };
    var queued = 0;
    var queue = function () { if (!queued) queued = requestAnimationFrame(function () { queued = 0; fit(); }); };
    fit();
    window.addEventListener('resize', queue);
    window.addEventListener('load', queue);
    if (window.ResizeObserver) {
      var ro = new ResizeObserver(queue);
      ro.observe(document.documentElement);
      if (host.parentElement) ro.observe(host.parentElement);
    }
  }
  var reduceMotion = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
  if (reduceMotion || !('IntersectionObserver' in window)) return;
  Array.prototype.forEach.call(document.querySelectorAll('#gc-contact .gc'), function (section) {
    var panel = section.querySelector('.gc__panel');
    if (!panel) return;
    section.classList.add('gc--wait');
    var io = new IntersectionObserver(function (entries) {
      if (entries[0].isIntersecting) { io.disconnect(); section.classList.remove('gc--wait'); }
    }, { threshold: 0.2 });
    io.observe(panel);
  });
})();
</script>
